---
name: CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: write
  id-token: write
  deployments: write
  packages: write

jobs:
  cicd:
    uses: johnqh/workflows/.github/workflows/unified-cicd.yml@main
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      GH_PACKAGES_READ_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
    with:
      publish-target: github

  publish-specialized:
    needs: cicd
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        package:
          - agriculture-components
          - analytics-components
          - auth-components
          - automotive-components
          - collaboration-components
          - communication-components
          - construction-components
          - design-components
          - devops-components
          - documents-components
          - ecommerce-components
          - education-components
          - email-components
          - energy-components
          - entertainment-components
          - entity-components
          - events-components
          - finance-components
          - fitness-components
          - food-components
          - gaming-components
          - government-components
          - healthcare-components
          - hr-components
          - insurance-components
          - interaction-components
          - iot-components
          - legal-components
          - logistics-components
          - manufacturing-components
          - marketing-components
          - media-components
          - monitoring-components
          - nonprofit-components
          - project-management-components
          - ratelimit-components
          - realestate-components
          - retail-components
          - scheduling-components
          - scientific-components
          - search-components
          - security-components
          - social-components
          - subscription-components
          - travel-components
          - visualization-components
          - web3-components
          - workflow-components
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Configure GitHub Packages registry
        run: |
          printf 'registry=https://registry.npmjs.org/\n@sudobility:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' > .npmrc
          cp .npmrc "$HOME/.npmrc"
      - name: Check version on GitHub Packages
        id: cv
        working-directory: ./packages/${{ matrix.package }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          LOCAL=$(node -p "require('./package.json').version")
          PUB=$(npm view "$NAME@$LOCAL" version 2>/dev/null || echo "")
          if [ "$PUB" = "$LOCAL" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; else echo "skip=0" >> "$GITHUB_OUTPUT"; fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
      # Remove the committed bun.lock first: it pins @sudobility/* to an empty
      # resolution URL, so bun falls back to npmjs and 404s on
      # GitHub-Packages-only versions. A fresh install re-resolves through
      # .npmrc, which routes @sudobility to npm.pkg.github.com.
      - name: Install
        if: steps.cv.outputs.skip == '0'
        working-directory: ./packages/${{ matrix.package }}
        run: |
          rm -f bun.lock
          bun install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
          BUN_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Build
        if: steps.cv.outputs.skip == '0'
        working-directory: ./packages/${{ matrix.package }}
        run: bun run build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
          BUN_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Publish to GitHub Packages
        if: steps.cv.outputs.skip == '0'
        working-directory: ./packages/${{ matrix.package }}
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
